   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(528.687969 294.85668)">Optional distribution</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(566.630937 306.859414)">module</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #0f294d" transform="translate(695.105117 295.027217)">Water-quality safeguard</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #0f294d" transform="translate(727.215859 306.429072)">(test / treat)</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #c2453d" transform="translate(718.476133 385.734378)">Quality verified +</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #c2453d" transform="translate(723.14582 395.936702)">OEM approved?</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1f5e3c" transform="translate(521.713188 385.355078)">YES → compatible washing</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #1f5e3c" transform="translate(530.811563 395.917484)">machine / utility outlet</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #c2453d" transform="translate(838.62 388.506378)">NO → manual</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #c2453d" transform="translate(838.62 398.708702)">use or drain</text>
   </g>
   <g id="text_13">
