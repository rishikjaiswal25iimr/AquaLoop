   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(540.908281 86.95668)">Overflow bypass</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(535.948125 98.959414)">→ household drain</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(534.595781 189.52107)">Manual dispensing</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(578.177031 201.523023)">tap</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #0f294d" transform="translate(698.692852 189.690846)">Utility reuse: mopping,</text>
