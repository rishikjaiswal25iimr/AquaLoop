   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(372.561094 182.578844)">AquaLoop</text>
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(363.78 195.781852)">storage tank</text>
