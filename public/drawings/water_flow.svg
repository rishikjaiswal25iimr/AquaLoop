    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #e8a33d" transform="translate(477.155357 250.949861) rotate(-320)">conditional</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c2453d" x="35.1" y="294.770437" transform="rotate(-0 35.1 294.770437)">✕  Never connected</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0f294d" transform="translate(35.1 317.087473)">• to drinking-water or cooking-water plumbing</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0f294d" transform="translate(35.1 327.889934)">• as untreated supply to a dishwasher</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0f294d" transform="translate(35.1 338.692395)">• to any appliance without testing, treatment and manufacturer approval</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #5b6b7c" transform="translate(23.94 388.729502)">* TDS alone does not establish suitability; reject-water quality varies with</text>
