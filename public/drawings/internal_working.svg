   </g>
   <g id="text_10">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #c2453d" transform="translate(21.437 267.10714)">⑤ Controlled outlet to a</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #c2453d" transform="translate(19.443187 278.149655)">compatible appliance —</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #c2453d" transform="translate(15.242812 289.192171)">ONLY after water testing,</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #c2453d" transform="translate(7.2 300.234686)">treatment &amp; OEM approval</text>
   </g>
