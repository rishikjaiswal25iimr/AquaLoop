   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="245.777417" y="233.274444" transform="rotate(-0 245.777417 233.274444)">Safeguard</text>
   </g>
   <g id="text_7">
