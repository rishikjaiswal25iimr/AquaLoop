   <g id="text_1">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #0f294d" transform="translate(777.739343 61.152678)">① RO reject water in</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #0f294d" transform="translate(777.739343 72.555276)">(retrofit tee on drain line)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #0f294d" transform="translate(236.023083 433.912614)">② Overflow bypass → drain</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #0f294d" transform="translate(229.60613 445.315212)">(float lifts when full; no spill)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #0f294d" transform="translate(628.938805 203.271779)">③ Level</text>
